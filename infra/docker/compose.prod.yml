# IDEALX production: the shop (idealx.in) and Stock Room (stock.idealx.in) on one server.
#
#   cp .env.production.example .env    # at the repo root; fill in, see docs/DEPLOY.md
#   sh scripts/prod.sh up -d --build    # wrapper for: docker compose --env-file .env -f infra/docker/compose.prod.yml
#
# Only Caddy publishes ports (80/443). Everything else talks on the internal network.
# Data lives in named volumes and survives `down` / `up`; only `down -v` deletes it.
name: idealx

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Settings shared by the API, the worker and beat. Everything from .env is passed through;
# the values below are derived from it or fixed for production.
x-api: &api
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.api
  image: idealx-api
  restart: always
  logging: *logging
  env_file: ../../.env
  environment: &api-env
    NODE_ENV: production
    DATABASE_URL: postgresql://idealx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/idealx
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    AUTH_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    S3_ENDPOINT: http://storage:8333
    S3_PUBLIC_ENDPOINT: https://${SITE_DOMAIN}
    S3_FORCE_PATH_STYLE: "true"
    OTP_DEV_MODE: "false"
    # Server to server inside the network; set INVENTORY_API_KEY in .env to switch the link on.
    INVENTORY_API_URL: ${INVENTORY_API_URL:-http://inventory:8787}
    INVENTORY_APP_URL: https://${STOCK_DOMAIN:?set STOCK_DOMAIN in .env}
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: idealx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: idealx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idealx -d idealx"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # S3-compatible object store (SeaweedFS): product photos are public, invoices private.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: always
    logging: *logging
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-media}
    volumes:
      - ../seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [internal]

  # One-shot: database migrations and storage buckets, before the API starts.
  migrate:
    <<: *api
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.bootstrap && python -m app.services.storage.s3"]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  api:
    <<: *api
    command: ["gunicorn", "app.main:app", "-w", "3", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--access-logfile", "-", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *api
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "celery,invoices,tenders,gstr,notify,inventory"]
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *api
    # Schedule state lives in /tmp: the image runs as a non-root user and the schedule is in code.
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      worker:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      target: runner
    image: idealx-web
    restart: always
    logging: *logging
    env_file: ../../.env
    environment:
      <<: *api-env
      INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  # Stock Room. Its own login and SQLite database; the site reads stock from it by API key.
  inventory-init:
    image: busybox:1.36
    command: ["chown", "1000:1000", "/backups"]
    volumes:
      - ../../apps/inventory/backups:/backups
    logging: *logging

  inventory:
    build: ../../apps/inventory
    image: idealx-inventory
    restart: always
    logging: *logging
    depends_on:
      inventory-init:
        condition: service_completed_successfully
    environment:
      APP_SECRET: ${STOCK_APP_SECRET:-}
      METRICS_TOKEN: ${STOCK_METRICS_TOKEN:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    volumes:
      - stockroom_data:/data
      - ../../apps/inventory/backups:/backups
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *logging
    depends_on:
      - web
      - inventory
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      STOCK_DOMAIN: ${STOCK_DOMAIN}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-private}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  storage_data:
  stockroom_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
