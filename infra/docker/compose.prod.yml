name: bharatboot-prod

x-api-env: &api-env
  DATABASE_URL: postgresql://bharatboot:${POSTGRES_PASSWORD}@postgres:5432/bharatboot
  REDIS_URL: redis://redis:6379/0
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_URL: ${AUTH_URL}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-bharatboot}
  JWT_ISSUER: ${JWT_ISSUER:-bharatboot-auth}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
  MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
  MSG91_SENDER_ID: ${MSG91_SENDER_ID}
  MSG91_TEMPLATE_OTP: ${MSG91_TEMPLATE_OTP}
  OTP_DEV_MODE: "false"
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  SMTP_FROM: ${SMTP_FROM}
  SMTP_TLS: ${SMTP_TLS:-true}
  SELLER_GSTIN: ${SELLER_GSTIN}
  SELLER_LEGAL_NAME: ${SELLER_LEGAL_NAME}
  SELLER_TRADE_NAME: ${SELLER_TRADE_NAME}
  SELLER_STATE_CODE: ${SELLER_STATE_CODE}
  SELLER_ADDRESS_JSON: ${SELLER_ADDRESS_JSON}
  SELLER_EMAIL: ${SELLER_EMAIL}
  SELLER_PHONE: ${SELLER_PHONE}
  SELLER_FINANCIAL_YEAR: ${SELLER_FINANCIAL_YEAR}
  IRP_ENABLED: ${IRP_ENABLED:-false}
  IRP_BASE_URL: ${IRP_BASE_URL}
  IRP_USERNAME: ${IRP_USERNAME}
  IRP_PASSWORD: ${IRP_PASSWORD}
  IRP_CLIENT_ID: ${IRP_CLIENT_ID}
  IRP_CLIENT_SECRET: ${IRP_CLIENT_SECRET}
  EWB_ENABLED: ${EWB_ENABLED:-false}
  CPPP_RSS_URL: ${CPPP_RSS_URL}
  TENDER_INBOX_HOST: ${TENDER_INBOX_HOST}
  TENDER_INBOX_PORT: ${TENDER_INBOX_PORT}
  TENDER_INBOX_USER: ${TENDER_INBOX_USER}
  TENDER_INBOX_PASS: ${TENDER_INBOX_PASS}
  TENDER_INBOX_TLS: ${TENDER_INBOX_TLS}
  SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL}
  SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN}
  ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: bharatboot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bharatboot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatboot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: always
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["gunicorn", "app.main:app", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--access-logfile", "-"]
    networks:
      - internal

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: always
    environment:
      <<: *api-env
    depends_on:
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    networks:
      - internal

  beat:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: always
    environment:
      <<: *api-env
    depends_on:
      worker:
        condition: service_started
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    networks:
      - internal

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      target: runner
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bharatboot:${POSTGRES_PASSWORD}@postgres:5432/bharatboot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      API_URL: ${API_URL}
      INTERNAL_API_URL: http://api:8000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID}
      MSG91_TEMPLATE_OTP: ${MSG91_TEMPLATE_OTP}
      OTP_DEV_MODE: "false"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bharatboot}
      JWT_ISSUER: ${JWT_ISSUER:-bharatboot-auth}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST}
      ADMIN_TOTP_ISSUER: ${ADMIN_TOTP_ISSUER:-BharatBoot}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
