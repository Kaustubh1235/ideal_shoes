name: bharatboot

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://bharatboot:devpass@postgres:5432/bharatboot}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  AUTH_SECRET: ${AUTH_SECRET:-dev-secret-please-change-in-prod-abcdefgh12345678}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-bharatboot}
  JWT_ISSUER: ${JWT_ISSUER:-bharatboot-auth}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
  MSG91_SENDER_ID: ${MSG91_SENDER_ID:-BHRTBT}
  MSG91_TEMPLATE_OTP: ${MSG91_TEMPLATE_OTP:-}
  OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-media}
  S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-private}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devaccess}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-devsecret123}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: ${SMTP_HOST:-mailhog}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@bharatboot.local}
  SELLER_GSTIN: ${SELLER_GSTIN:-}
  SELLER_LEGAL_NAME: ${SELLER_LEGAL_NAME:-BharatBoot Manufacturing Pvt Ltd}
  SELLER_TRADE_NAME: ${SELLER_TRADE_NAME:-BharatBoot}
  SELLER_STATE_CODE: ${SELLER_STATE_CODE:-27}
  SELLER_ADDRESS_JSON: ${SELLER_ADDRESS_JSON:-{"line1":"","line2":"","city":"","state":"","pincode":"","country":"India"}}
  SELLER_EMAIL: ${SELLER_EMAIL:-}
  SELLER_PHONE: ${SELLER_PHONE:-}
  SELLER_FINANCIAL_YEAR: ${SELLER_FINANCIAL_YEAR:-2025-26}
  IRP_ENABLED: ${IRP_ENABLED:-false}
  IRP_BASE_URL: ${IRP_BASE_URL:-}
  IRP_USERNAME: ${IRP_USERNAME:-}
  IRP_PASSWORD: ${IRP_PASSWORD:-}
  IRP_CLIENT_ID: ${IRP_CLIENT_ID:-}
  IRP_CLIENT_SECRET: ${IRP_CLIENT_SECRET:-}
  EWB_ENABLED: ${EWB_ENABLED:-false}
  CPPP_RSS_URL: ${CPPP_RSS_URL:-https://eprocure.gov.in/cppp/rss/govtprocurement_rss.xml}
  TENDER_INBOX_HOST: ${TENDER_INBOX_HOST:-}
  TENDER_INBOX_PORT: ${TENDER_INBOX_PORT:-993}
  TENDER_INBOX_USER: ${TENDER_INBOX_USER:-}
  TENDER_INBOX_PASS: ${TENDER_INBOX_PASS:-}
  TENDER_INBOX_TLS: ${TENDER_INBOX_TLS:-true}
  SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
  SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  INVENTORY_API_URL: ${INVENTORY_API_URL:-}
  INVENTORY_API_KEY: ${INVENTORY_API_KEY:-}
  INVENTORY_APP_URL: ${INVENTORY_APP_URL:-}
  AUTH_URL: ${AUTH_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bharatboot
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: bharatboot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatboot -d bharatboot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store (SeaweedFS; MinIO no longer publishes images). Public bucket "media"
  # for product photos, private bucket "private" for invoices; created by the api on start.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    environment:
      S3_ACCESS_KEY: devaccess
      S3_SECRET_KEY: devsecret123
      S3_BUCKET: media
    ports:
      - "9000:8333"
    volumes:
      - ../seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-env
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.bootstrap && python -m app.services.storage.s3 && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - ../../apps/api:/app
    depends_on:
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "celery,invoices,tenders,gstr,notify,inventory"]

  beat:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - ../../apps/api:/app
    depends_on:
      worker:
        condition: service_started
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bharatboot:devpass@postgres:5432/bharatboot
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-please-change-in-prod-abcdefgh12345678}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://api:8000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-BHRTBT}
      MSG91_TEMPLATE_OTP: ${MSG91_TEMPLATE_OTP:-}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-media}
      INVENTORY_APP_URL: ${INVENTORY_APP_URL:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bharatboot}
      JWT_ISSUER: ${JWT_ISSUER:-bharatboot-auth}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      ADMIN_TOTP_ISSUER: ${ADMIN_TOTP_ISSUER:-BharatBoot}
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages:/app/packages
      - web_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    command: ["pnpm", "--filter", "@bharatboot/web", "dev"]

volumes:
  postgres_data:
  redis_data:
  storage_data:
  web_node_modules:
  web_next:
