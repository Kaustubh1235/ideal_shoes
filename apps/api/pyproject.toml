[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatboot-api"
version = "0.1.0"
description = "BharatBoot FastAPI backend - GST invoicing, payments, integrations, jobs"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "gunicorn==23.0.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "SQLAlchemy==2.0.35",
  "alembic==1.13.3",
  "psycopg[binary]==3.2.3",
  "asyncpg==0.29.0",
  "redis==5.0.8",
  "celery==5.4.0",
  "kombu==5.4.2",
  "httpx==0.27.2",
  "tenacity==9.0.0",
  "structlog==24.4.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "pyotp==2.9.0",
  "qrcode[pil]==7.4.2",
  "razorpay==2.0.1",
  "boto3==1.35.30",
  "WeasyPrint==62.3",
  # WeasyPrint 62 calls pydyf APIs removed in 0.11 ("'super' object has no attribute 'transform'").
  "pydyf==0.10.0",
  "jinja2==3.1.4",
  "feedparser==6.0.11",
  "email-validator==2.2.0",
  "python-multipart==0.0.10",
  "Pillow==10.4.0",
  "lxml==5.3.0",
  "babel==2.16.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "httpx==0.27.2",
  "ruff==0.6.8",
  "mypy==1.11.2",
  "types-redis==4.6.0.20240903",
  "factory-boy==3.3.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
