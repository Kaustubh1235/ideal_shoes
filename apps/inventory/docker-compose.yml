# Stock Room: the app plus Caddy, which gets and renews the HTTPS certificate on its own.
#
#   cp .env.example .env     # set DOMAIN
#   docker compose up -d
#   open https://<DOMAIN>    # first visit creates the owner account
#
# The app itself only listens inside the Docker network; nothing but Caddy can reach it.
# Stock and backups survive `docker compose down` / `up`: stock is in the stockroom-data volume,
# backups are in ./backups next to this file. Only `docker compose down -v` deletes the volume.

# Keep container logs from filling the disk: at most 5 files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Docker creates ./backups as root on a fresh server, and the app runs as user "bun" (uid 1000),
  # so nightly backups would silently fail. This runs once before the app and hands the folder over.
  init-backups:
    image: busybox:1.36
    command: ["chown", "1000:1000", "/backups"]
    volumes:
      - ./backups:/backups
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    logging: *logging
    depends_on:
      init-backups:
        condition: service_completed_successfully
    environment:
      APP_SECRET: ${APP_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    volumes:
      - stockroom-data:/data
      - ./backups:/backups
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  stockroom-data:
  caddy-data:
  caddy-config:
