name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @bharatboot/gst test
      - run: pnpm --filter @bharatboot/web typecheck
      - run: pnpm --filter @bharatboot/web build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          AUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaa
          AUTH_URL: http://localhost:3000
          API_URL: http://localhost:8000
          INTERNAL_API_URL: http://localhost:8000

  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bharatboot
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: bharatboot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bharatboot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info
      - run: pip install -e ./apps/api[dev]
      - name: Ruff
        run: cd apps/api && ruff check .
      - name: Migrations
        run: cd apps/api && alembic upgrade head
        env:
          DATABASE_URL: postgresql://bharatboot:devpass@localhost:5432/bharatboot
          AUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaa
      - name: Pytest
        run: cd apps/api && pytest -ra
        env:
          DATABASE_URL: postgresql://bharatboot:devpass@localhost:5432/bharatboot
          AUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaa

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [ts, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: bharatboot/api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          target: builder
          push: false
          tags: bharatboot/web:ci
