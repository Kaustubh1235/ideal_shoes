name: CI

# Everything that must pass before a deploy, on every pull request and on main: the shop (Next.js), the API
# (FastAPI, with the Postgres security tests), Stock Room (unit, security and browser tests), a secret scan,
# known-vulnerability audits, the production images, and the whole stack in Docker used like a customer,
# the owner and a dealer would (user acceptance test). deploy.yml runs only after this whole workflow passes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the database client (the web app's types come from it)
        run: pnpm --filter @bharatboot/db exec prisma generate
      - run: pnpm --filter @bharatboot/gst test
      - run: pnpm --filter @bharatboot/web lint
      - run: pnpm --filter @bharatboot/web typecheck
      - run: pnpm --filter @bharatboot/web test
      - run: pnpm --filter @bharatboot/web build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          AUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_URL: http://localhost:3000
          INTERNAL_API_URL: http://localhost:8000

  api:
    name: API (ruff, migrations, pytest incl. Postgres security tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: idealx
          POSTGRES_PASSWORD: ci-pass
          POSTGRES_DB: idealx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idealx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://idealx:ci-pass@localhost:5432/idealx
      AUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b shared-mime-info
      - run: pip install -e "./apps/api[dev]"
      - name: Ruff
        run: cd apps/api && ruff check .
      - name: Migrations apply cleanly
        run: cd apps/api && alembic upgrade head
      - name: Pytest
        run: cd apps/api && pytest -ra
        env:
          # The security tests rebuild the schema from the models in this database.
          TEST_DATABASE_URL: postgresql://idealx:ci-pass@localhost:5432/idealx

  security:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Critical advisories fail the build. One high one is known and accepted for now: zod 3
      # (memory use on oversized inputs; Next caps server-action bodies). Fixed by moving to zod 4.
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level critical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (API)
        run: |
          pip install pip-audit pip-tools
          pip-compile -q apps/api/pyproject.toml -o /tmp/api-req.txt
          pip-audit -r /tmp/api-req.txt --no-deps --disable-pip

  stockroom:
    name: Stock Room (unit, security and browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/inventory
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Unit, API and security tests
        run: bun test tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Browser test (phone and desktop, English and Hindi)
        run: python3 e2e/run_e2e.py

  secrets:
    name: No secrets in the code or its history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stack:
    name: Whole stack in Docker (acceptance test)
    runs-on: ubuntu-latest
    needs: [web, api, stockroom]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bharatboot/db exec prisma generate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Build, start and use the whole stack
        run: sh e2e/ci_stack.sh
      - name: Logs when it failed
        if: failure()
        run: docker compose --env-file .env -f infra/docker/compose.prod.yml -f e2e/compose.e2e.yml logs --tail 80

  images:
    name: Production images build
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: idealx-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          target: runner
          push: false
          tags: idealx-web:ci
      - uses: docker/build-push-action@v6
        with:
          context: apps/inventory
          push: false
          tags: idealx-inventory:ci
