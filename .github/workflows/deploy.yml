name: Deploy

# After CI passes on main, update the server (Oracle Cloud) to that commit. The server builds and
# restarts the stack itself and rolls back if the new version is not healthy (scripts/deploy.sh).
# Also runs by hand: Actions → Deploy → Run workflow.
#
# Needs, under Settings → Secrets and variables → Actions (docs/DEPLOY.md, "Automatic deploys"):
#   secrets   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
#   variable  SITE_DOMAIN (e.g. idealx.store), for the check from outside
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Pick the tested commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          sha="${RUN_SHA:-$head}"
          if [ "$sha" != "$head" ]; then
            echo "::notice::main has moved on to ${head:0:7}; its own CI run will deploy it. Nothing to do for ${sha:0:7}."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$RUN_SHA" ]; then
            ok=$(gh run list -R "${{ github.repository }}" --workflow CI --commit "$sha" --status success --json databaseId --jq length)
            [ "$ok" -gt 0 ] || { echo "::error::CI has not passed for ${sha:0:7} yet; not deploying it."; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Connect to the server
        if: steps.pick.outputs.go == 'true'
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::No server connected yet (DEPLOY_* secrets are empty); nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The server's own key, pinned: a different machine answering at that address is refused.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy (build, restart, health check, roll back on failure)
        if: steps.ssh.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.pick.outputs.sha }}
        # The key may only run scripts/deploy.sh on the server; the commit id sent here is its one input,
        # and deploy.sh accepts it only if it is a full id that is part of main.
        run: ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 "${DEPLOY_USER:-ubuntu}@$DEPLOY_HOST" "$SHA"

      - name: Check from outside
        if: steps.ssh.outputs.ready == 'true' && vars.SITE_DOMAIN != ''
        env:
          SITE: ${{ vars.SITE_DOMAIN }}
        run: |
          curl -fsS --retry 5 --retry-delay 10 "https://$SITE/api/v1/healthz"
          curl -fsS --retry 5 --retry-delay 10 -o /dev/null "https://$SITE/"
          curl -fsS --retry 5 --retry-delay 10 "https://stock.$SITE/healthz"
